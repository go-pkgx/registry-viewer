name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: vet + test (100% coverage floor)
        run: |
          go vet ./...
          go test -covermode=set -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "coverage: $pct%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 100) { print "coverage below 100%"; exit 1 } }'
      - name: wasm build
        run: GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -o /tmp/app.wasm .

  # MVVM is mandatory: this reusable gate fails the build if any app code mutates
  # widget state outside a go-widgets/mvvm binding (see go-widgets/mvvmlint).
  mvvm:
    uses: go-widgets/mvvmlint/.github/workflows/mvvmlint.yml@main

  # No hand-drawn UI: this go/analysis pass fails the build if any app code calls
  # a painter drawing primitive (FillRect, Stroke*, DrawImage, Text, …) on a
  # go-widgets/painter receiver, or constructs a toolkit widget inside a
  # Draw/Paint/Render method — every element must be a toolkit widget (see
  # go-widgets/bricolint). The negative control proves the guard actually bites.
  bricolint:
    runs-on: ubuntu-latest
    env: { GOWORK: "off" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.1" }
      - name: Install bricolint
        run: go install github.com/go-widgets/bricolint/cmd/bricolint@v0.1.0
      - name: Guard against hand-drawn UI
        run: go vet -vettool="$(go env GOPATH)/bin/bricolint" ./...
      - name: Negative control (the guard must bite)
        run: BRICOLINT="$(go env GOPATH)/bin/bricolint" bash hack/bricolint-negative-control.sh
